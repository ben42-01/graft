# Graft — Agent Policy
# Machine-readable guardrails for the agentic loop (docs/AGENTS.md §2.2, §5).
# Build and Review skills MUST read this file before acting. It is itself protected:
# no agent edits this file.

version: 1

# Branching model (standard GitHub flow with a release branch).
#   feature/bugfix/chore  branch from develop -> PR into develop
#   release               develop -> main, tagged, human-approved
#   hotfix                branch from main -> PR into main, then back-merged
branches:
  default: develop # every PR targets this unless it is a release
  release: main # only ever receives develop, via a type:release contract
  protected:
    - develop
    - main

limits:
  # Max concurrent issues labelled agent:building (docs/AGENTS.md §3)
  wip: 3
  # Soft ceiling on PR diff size; larger work must be split by the Drafting Agent
  max_diff_lines: 600
  # Build <-> Review cycles before ESCALATE (docs/AGENTS.md §2.3)
  max_review_cycles: 2

# Paths an agent may never touch without explicit human co-review.
# A Build Agent that needs a change here STOPS, comments the required diff on the
# issue, and sets agent:blocked. A Review Agent flags any diff touching these.
protected_paths:
  # The agent machinery itself
  - .claude/**
  - .github/agent-policy.yml
  - .github/ISSUE_TEMPLATE/**
  # CI / release config
  - .github/workflows/**
  # Auth core (docs/BACKEND.md §3)
  - src/server/auth/**
  - src/server/services/tokens.ts
  - src/app/api/v1/auth/**
  - src/app/api/.well-known/**
  # Tenant isolation enforcement — the single most important invariant
  - src/server/repositories/base.ts
  - src/server/context.ts
  # Billing & entitlements (docs/TIERS.md §4)
  - src/app/api/v1/webhooks/stripe/**
  - src/server/services/entitlements.ts
  - src/server/services/meters.ts
  # Destructive / environment
  - scripts/reset-db.ts
  - migrations/**
  - docker/**
  - .env*
  - "*.pem"

# Changes here are allowed but MUST be called out explicitly in the PR body.
declare_in_pr:
  - package.json
  - package-lock.json
  - tsconfig.json
  - next.config.*
  - vitest.config.*
  - playwright.config.*

forbidden_actions:
  - Adding a dependency without name + license + reason in the PR body
  - "Deleting, skipping, or `.only`-ing a test to make CI green"
  - Lowering a coverage threshold or lint severity
  - "`eslint-disable` / `@ts-ignore` / `as any` without an adjacent justification comment"
  - Committing a secret, key, or real credential in any form
  - Pushing directly to develop or main, force-pushing, or altering branch protection
  - Opening a PR against main for anything other than a type:release contract
  - Modifying an issue's Acceptance Criteria (propose an amendment instead)
  - Deploying to production (docs/AGENTS.md §4 — humans only)

# Every new query, endpoint, and gated feature is checked against this
# (docs/BACKEND.md §§1-6). Review Agent runs it as a checklist.
security_checklist:
  - Every Mongo query scoped by ctx.tenantId via the repository layer
  - Request body / query / params validated with Zod at the boundary
  - assertPermission() for RBAC and can() / checkQuota() for tier gating
  - Rate limiting declared for any new endpoint (docs/BACKEND.md §4)
  - No PII in logs; requestId + tenantId + userId only
  - Cross-tenant access attempt returns 403/404, proven by a Bruno test
  - Errors use the standard envelope and a stable machine-readable code

# A human decides; an agent may do the clicking. These are decisions that must
# originate with a human — an agent never takes them on its own initiative.
human_gates:
  - Queue entry (agent:draft -> agent:queued)
  - Contract amendments
  - Authorising a merge into develop
  - Authorising a promotion of develop to main
  - Releases and tags
  - Any diff touching protected_paths

# Merging is EXECUTION, not a decision. On an explicit human instruction ("merge
# it", "merge everything"), an agent performs the merge — provided every
# precondition below holds for that specific PR. An agent never merges unasked,
# and never merges a PR it cannot verify.
merge_policy:
  requires_human_instruction: true
  preconditions:
    - PR targets develop (main only under a type:release contract, authorised separately)
    - All required CI checks pass; no pending or failing checks
    - A cold-context Soft Review recorded a PASS verdict on this PR
    - The reviewing agent was not the building agent
    - No unresolved change requests or review threads
    - The diff touches no protected_paths
  # Any precondition that fails: skip that PR, merge the rest, and report exactly
  # what was held back and why. Never silently widen "merge everything".
  on_precondition_failure: skip_and_report
  method:
    develop: squash # one issue, one commit on develop
    main: merge # release promotions stay legible in history
  after_merge:
    - Delete the work branch
    - Close the issue if the PR body did not already close it
    - Report every merge and every skip back to the human
