# Graft — QA stack (docs/WORKFLOW.md §4.1)
# Identical to dev except: separate container names, port 27018, DB graft_qa, and
# NO named volume — the QA stack is ephemeral so every run starts from identical
# deterministic fixtures. `down -v` wipes it completely.
name: graft-qa

services:
  mongo:
    image: mongo:7
    container_name: graft-qa-mongo
    # See docker-compose.dev.yml for why this is a single-node replica set, not a
    # second Mongo instance, why it is initiated by wait-for-mongo.ts, and why
    # the keyfile goes through mongo-entrypoint.sh instead of a direct bind mount.
    entrypoint: ["/graft/mongo-entrypoint.sh"]
    command: ["--auth", "--replSet", "rs0", "--keyFile", "/tmp/graft-mongo-keyfile"]
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env.qa}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env.qa}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-graft_qa}
      GRAFT_APP_USER: ${MONGO_APP_USER:-graft_app}
      GRAFT_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env.qa}
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
      - ../.keys/mongo:/etc/graft/keys:ro
      - ./mongo-entrypoint.sh:/graft/mongo-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_ROOT_USER}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: graft-qa-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage for tenant uploads — form carousel images today, any signed-URL
  # upload later (docs/BACKEND.md §4). MinIO is S3-compatible, so dev, QA and
  # production run the *same* application code path against different endpoints;
  # a signed-URL bug cannot be a production-only surprise. Credentials come from
  # .env.qa like every other password in this file.
  minio:
    # quay.io, not Docker Hub: MinIO withdrew the community images from
    # Docker Hub, and `minio/minio` now answers every pull with "repository
    # does not exist or may require docker login". A developer whose machine
    # still had the layers cached saw nothing wrong; CI, which always pulls
    # fresh, failed on every run. Same tag, same digest, different registry.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: graft-qa-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${S3_PORT:-9002}:9000"
      # The browser console, for looking at what actually landed in the bucket.
      - "${S3_CONSOLE_PORT:-9003}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set in .env.qa}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set in .env.qa}
      # The app mints a presigned PUT and the browser uploads straight here, so
      # the bucket must answer a cross-origin preflight from the app's origin.
      # Scoped to that origin rather than `*`: nothing else has any business
      # spending a signature.
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:-http://localhost:3100}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
