# Graft — local development stack (docs/WORKFLOW.md §4.1)
# Credentials are interpolated from .env.dev (gitignored, generated by `npm run setup`).
# No password is ever hardcoded in this file.
name: graft-dev

services:
  mongo:
    image: mongo:7
    container_name: graft-dev-mongo
    # Auth enabled locally, exactly as in production — connection-string handling,
    # least privilege and auth failures behave identically everywhere. `--replSet`
    # is a single-node replica set, not a second instance: it exists solely to
    # unlock multi-document transactions (GRAFT-09 AC2, docs/BACKEND.md §6), which
    # MongoDB refuses on a standalone `mongod`. Every Atlas cluster is already a
    # replica set for the same reason, so this brings dev in line with prod rather
    # than adding infrastructure. The set itself is initiated by
    # scripts/wait-for-mongo.ts, not here — docker-entrypoint-initdb.d scripts run
    # against a temp instance the official image starts without replication, so
    # `rs.initiate()` cannot live in mongo-init/.
    # `--keyFile` is internal cluster auth, mandatory the moment `--auth` and
    # `--replSet` are combined even for one member — generated by `npm run setup`
    # (scripts/setup-env.ts), gitignored, never committed. Points at a path on
    # the container's own writable layer, not the bind-mounted source directly:
    # see mongo-entrypoint.sh for why, and where that copy actually happens.
    entrypoint: ["/graft/mongo-entrypoint.sh"]
    command: ["--auth", "--replSet", "rs0", "--keyFile", "/tmp/graft-mongo-keyfile"]
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env.dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env.dev}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-graft_dev}
      # Consumed by mongo-init/01-create-users.js to create the app user
      GRAFT_APP_USER: ${MONGO_APP_USER:-graft_app}
      GRAFT_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env.dev}
    volumes:
      - graft_dev_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
      - ../.keys/mongo:/etc/graft/keys:ro
      - ./mongo-entrypoint.sh:/graft/mongo-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_ROOT_USER}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: graft-dev-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  graft_dev_data:
